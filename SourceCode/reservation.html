<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book | Moffat Bay Lodge</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="attractions.html">Attractions</a>
            <a href="contact.html">Contact</a>
            <a href="reservation.html">Book</a>
        </nav>
    </header>

    <main>
        <section>
            <h1>Book Your Stay</h1>
            <p>Choose a room type and travel dates for your stay at Moffat Bay Lodge.</p>
        </section>

        <section>
            <form>
                <div>
                    <label for="roomType">Room Type</label>
                    <select id="roomType">
                        <option>Double Full Beds</option>
                        <option>Queen</option>
                        <option>Double Queen Beds</option>
                    </select>
                </div>
                <div>
                    <label for="guests">Guests</label>
                    <input id="guests" type="number" value="2">
                </div>
                <div>
                    <label for="checkIn">Check-In</label>
                    <input id="checkIn" type="date">
                </div>
                <div>
                    <label for="checkOut">Check-Out</label>
                    <input id="checkOut" type="date">
                </div>
                <button type="button">Review Reservation</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Moffat Bay Lodge • One Signature Location</p>
    </footer>
</body>

</html>
