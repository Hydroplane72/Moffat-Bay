<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Moffat Bay Lodge</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="attractions.html">Attractions</a>
            <a href="contact.html">Contact</a>
            <a href="reservation.html">Book</a>
        </nav>
    </header>

    <main>
        <section>
            <h1>Contact</h1>
            <p>Phone: (555) 410-2233</p>
            <p>Email: stay@moffatbaylodge.com</p>
            <p>Address: 14 Harbor Crest Road, Moffat Bay Island</p>
        </section>

        <section>
            <h2>Send a Message</h2>
            <form>
                <div>
                    <label for="name">Name</label>
                    <input id="name" type="text">
                </div>
                <div>
                    <label for="email">Email</label>
                    <input id="email" type="email">
                </div>
                <div>
                    <label for="message">Message</label>
                    <textarea id="message" rows="4"></textarea>
                </div>
                <button type="button">Send</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Moffat Bay Lodge • One Signature Location</p>
    </footer>
</body>

</html>
